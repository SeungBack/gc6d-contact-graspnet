optimizer : {
  type: AdamW,
  kwargs: {
  lr : 0.001, 
  weight_decay : 0.0005
}}

scheduler: {
  type: CosineAnnealingLR,
  kwargs: {
  T_max: 50,
  eta_min: 0.00001
}}

dataset : {
  train : { _base_: configs/datasets/graspnet1b.yaml, 
            others: {subset: 'train'}},
  }

model : {
  NAME: ContactGraspNet, 
}
  
total_bs : 16
step_per_update : 1
max_epoch : 50

consider_metric: ContactGraspNetLoss

