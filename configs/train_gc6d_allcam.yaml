optimizer : {
  type: AdamW,
  kwargs: {
  lr : 0.001, 
  weight_decay : 0.0005
}}

scheduler: {
  type: LambdaLR,
  kwargs: {
  decay_step: 21,
  lr_decay: 0.9,
  lowest_decay: 0.02  # min lr = lowest_decay * lr
}}


dataset : {
  train : { _base_: configs/datasets/graspclutter6d.yaml, 
            others: {subset: 'train', 
            CAMERA: 'realsense-d415,realsense-d435,azure-kinect,zivid'}},
  }

model : {
  NAME: ContactGraspNet, 
}
  
total_bs : 16
step_per_update : 1
max_epoch : 60

consider_metric: ContactGraspNetLoss

